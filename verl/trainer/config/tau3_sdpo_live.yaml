defaults:
  - ppo_trainer
  - _self_

max_model_len: 14336

data:
  train_batch_size: 4
  val_batch_size: 4
  return_raw_chat: True
  max_prompt_length: 8192
  max_response_length: 6144
  filter_overlong_prompts: True
  truncation: error
  shuffle: True

actor_rollout_ref:
  hybrid_engine: True
  actor:
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: ${max_model_len}
    # Tau3 airline is language-only. Keep Qwen3.5 VLM visual weights fixed so
    # text-only RL updates cannot corrupt unused vision blocks.
    freeze_vision_tower: True
    use_kl_loss: False
    policy_loss:
      loss_mode: sdpo
      # Match original SDPO defaults: full-logit/top-k distillation with
      # generalized JSD alpha=0.5 and residual tail bucket.
      sdpo_full_logit_distillation: True
      sdpo_alpha: 0.5
      sdpo_distillation_topk: 100
      sdpo_distillation_add_tail: True
      # Latest-VERL computes the actor top-k support just before the optimizer
      # step, then gathers EMA-teacher probabilities on that same support.
      sdpo_topk_source: student_pre_update
      sdpo_is_clip: 2.0
      sdpo_loss_coef: 1.0
    optim:
      lr: 1e-6
      lr_warmup_steps: 0
  model:
    path: Qwen/Qwen3.5-4B
    trust_remote_code: True
    use_remove_padding: True
    enable_gradient_checkpointing: True
    lora_rank: 0
  rollout:
    name: vllm
    n: 8
    calculate_log_probs: True
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.55
    max_num_batched_tokens: ${max_model_len}
    max_model_len: ${max_model_len}
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: ${max_model_len}
    agent:
      num_workers: 2
      default_agent_loop: tool_agent
    multi_turn:
      enable: True
      format: tau3_qwen
      max_user_turns: 16
      max_assistant_turns: 16
      max_parallel_calls: 1
      max_tool_response_length: 512
      tool_response_truncate_side: middle
      tokenization_sanity_check_mode: ignore_strippable
      tool_config_path: ${oc.env:PROJECT_ROOT}/examples/sglang_multiturn/config/tool_config/tau3_live_airline_tool_config.yaml
      interaction_config_path: ${oc.env:PROJECT_ROOT}/examples/sglang_multiturn/config/interaction_config/tau3_live_interaction_config.yaml
    val_kwargs:
      top_p: 0.95
      temperature: 0.4
      n: 4
      do_sample: True

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: False
  use_kl_in_reward: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

reward:
  custom_reward_function:
    path: ${oc.env:PROJECT_ROOT}/verl/utils/reward_score/feedback/tau3_live.py
    name: compute_score
  reward_model:
    enable: False

ray_kwargs:
  ray_init:
    include_dashboard: False

trainer:
  project_name: SDPO-${oc.env:USER}
  experiment_name: tau3_sdpo_live
  val_before_train: False
  total_epochs: 30
  total_training_steps: 240
  test_freq: 30
  save_freq: 30
  default_local_dir: ${oc.env:SDPO_CHECKPOINT_ROOT,checkpoints/SDPO}/${trainer.project_name}/${trainer.experiment_name}

tau3:
  runtime: ${oc.env:TAU3_LIVE_RUNTIME,official_gym}
  feedback_mode: ${oc.env:TAU3_LIVE_FEEDBACK_FORMAT,none}
  domain: airline
  selected_task_ids: ${oc.env:TAU3_LIVE_TASK_IDS,}
  sdpo:
    enabled: True
    # Faithful/minimal Tau3 SDPO default: successful peer demonstrations only.
    # Heuristic Tau3 diagnostics are audit-only and must not be privileged
    # teacher feedback in this guarded baseline.
    max_reprompt_len: 6144
    reprompt_truncation: right
    success_reward_threshold: 1.0
    failure_reward_threshold: 1.0
    use_successful_peer_solution: True
    only_failed_rollouts: True
    dont_reprompt_on_self_success: True
    remove_thinking_from_demonstration: True
    # v3.5 controlled ablation: teacher-only redacted GT metadata plus one
    # same-UID failed assistant response. Defaults off to preserve peer-only SDPO.
    gt_metadata_enabled: ${oc.env:SDPO_GT_METADATA_ENABLED,false}
    failed_peer_enabled: ${oc.env:SDPO_FAILED_PEER_ENABLED,false}
    failed_peer_max_chars: ${oc.env:SDPO_FAILED_PEER_MAX_CHARS,4096}
    # Faithful SDPO path: compute teacher logprobs with a dedicated ref copy
    # and update that copy after each actor update via
    # teacher <- (1 - rate) * teacher + rate * actor. Set to
    # actor_snapshot for the cheaper latest-VERL approximation.
    teacher_backend: ${oc.env:SDPO_TEACHER_BACKEND,ema_ref}
    teacher_update_rate: ${oc.env:SDPO_TEACHER_UPDATE_RATE,0.05}
    target_guard:
      # Faithful baseline default is off. This remains available only as an
      # explicit guarded ablation and must not change peer-only row routing.
      enabled: False
      corrupted_row_weight: 0.0
      mask_nonterminal: True
      mask_budget_exhausted: True
      mask_response_saturated: True
      mask_parse_error: True
      mask_open_think: True
      mask_repetition: True
      mask_tool_loop: True
      max_response_tokens: ${data.max_response_length}
      repetition_ngram_size: 8
      repetition_max_count: 4
      max_tool_count: 32
    reprompt_template: |-
      {prompt}{solution}

      Correctly solve the original task.
    solution_template: |-

      Correct solution:

      {successful_previous_attempt}
